name: MarketNiora Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Prisma generate
        run: npx prisma generate --schema database/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Test suite
        run: npm test
      - name: Prisma validate
        run: npx prisma validate --schema database/prisma/schema.prisma
      - name: Verify protected engines unchanged in this commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: protected-file verification is informational only."
            exit 0
          fi
          base_ref="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch --no-tags --prune origin "${{ github.base_ref }}"
          fi
          head_ref="${{ github.sha }}"
          git cat-file -e "${base_ref}^{commit}" || {
            echo "Required base commit is unavailable: ${base_ref}"
            exit 1
          }
          changed="$(git diff --name-only "$base_ref" "$head_ref" -- backend/src/protected/rotationEngine.ts backend/src/protected/stockScoreEngine.ts)"
          if [ -n "$changed" ]; then
            echo "Protected files changed:"
            echo "$changed"
            exit 1
          fi
          echo "Protected files unchanged."
      - name: Git state summary
        run: |
          git status --short
          git rev-parse HEAD
          git diff --stat "${{ github.event.before }}" "${{ github.sha }}" || true
