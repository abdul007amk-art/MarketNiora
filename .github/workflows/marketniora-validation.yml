name: MarketNiora Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketniora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketniora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketniora_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema database/prisma/schema.prisma

      - name: Bootstrap CI database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/dars12-ci-bootstrap.sql

      - name: Apply DARS-1.2 migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260927_dars_evidence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260927_dars_run.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260928_dars_health_report.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Test suite
        run: npm test

      - name: Prisma validate
        run: npx prisma validate --schema database/prisma/schema.prisma

      - name: Verify protected engines unchanged in this commit
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: protected-file verification is informational only."
            exit 0
          fi

          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid previous commit SHA available; skipping protected-file diff check."
            exit 0
          fi

          changed="$(git diff --name-only "$base_ref" "$head_ref" -- backend/src/protected/rotationEngine.ts backend/src/protected/stockScoreEngine.ts)"

          if [ -n "$changed" ]; then
            echo "Protected files changed:"
            echo "$changed"
            exit 1
          fi

          echo "Protected files unchanged."

      - name: Git state summary
        run: |
          git status --short
          git rev-parse HEAD
          git diff --stat "${{ github.event.before }}" "${{ github.sha }}" || true
