name: MarketNiora CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketniora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketniora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketniora_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema database/prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate --schema database/prisma/schema.prisma

      - name: Bootstrap CI database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/dars12-ci-bootstrap.sql

      - name: Validate MASTER_4187 staging migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/master4187-staging-ci-bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_master_4187_staging_provenance.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/master4187-staging-ci-assert.sql

      - name: Apply DARS-1.2 migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260927_dars_evidence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260927_dars_run.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/20260928_dars_health_report.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: PostgreSQL integration tests
        run: node --experimental-strip-types --test tests/dars12.postgres.integration.test.ts

      - name: Protected engines unchanged
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^backend/src/protected/(rotationEngine|stockScoreEngine)\.ts$'; then
            echo "Protected DARS-1.1 engine changed."
            exit 1
          fi
          echo "Protected engines unchanged."

  auth-db-integration:
    name: Auth stores — isolated PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketniora_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketniora_auth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketniora_auth_ci
      MARKETNIORA_DB_TARGET: CI_TEST
      MARKETNIORA_CI_AUTH_DB_TEST: "1"
      NODE_ENV: test
      KMS_PROVIDER: local-dev
      KMS_LOCAL_MASTER_KEY: marketniora-only-ci-test-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema database/prisma/schema.prisma

      - name: Create isolated auth tables
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_marketniora.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_marketniora.sql

      - name: Test trigger function search_path hardening migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/security_function_search_path_fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_security_function_search_path.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/security_function_search_path_assert.sql

      - name: Run DB-backed auth store integration
        run: node --experimental-strip-types scripts/integrationTest.ts
