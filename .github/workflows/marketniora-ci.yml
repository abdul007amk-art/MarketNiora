name: MarketNiora CI
# Fresh verification run

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema database/prisma/schema.prisma

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/marketniora_ci
        run: npx prisma validate --schema database/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Protected engines unchanged
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^backend/src/protected/(rotationEngine|stockScoreEngine)\.ts$'; then
            echo "Protected DARS-1.1 engine changed."
            exit 1
          fi
          echo "Protected engines unchanged."
