name: MarketNiora Public Site

# Optional static landing-page deployment only.
# Run manually after enabling Settings → Pages → Build and deployment → GitHub Actions.
# The main research application remains hosted at MiniUp and is not deployed by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s public-site/index.html
          grep -q "Evidence before interpretation" public-site/index.html
          grep -q "Illustrative graphics are not live data" public-site/index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
